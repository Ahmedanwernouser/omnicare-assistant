[pytest]
# One command runs both services' suites from the repo root.
testpaths = backend/tests frontend/tests
pythonpath = backend frontend
addopts = -q --strict-markers
markers =
    integration: needs the real embedding model (skipped when not cached)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:starlette.*
    ignore:.*starlette.testclient.*:DeprecationWarning
    ignore::UserWarning
